# Rebuilds the Atlas data (scripts/make_maps.py: image sizes, click boxes, search index,
# draft list) whenever map files or map pages change on master, so a file uploaded by
# hand to atlas-downloads/ shows correctly without a manual step. Commits only if
# something changed; a commit made with GITHUB_TOKEN does not start this workflow again.
# It also runs once a day, so a "new" tag goes 30 days after the map's release date
# without waiting for a push.
name: Atlas data
on:
  push:
    branches: [master]
    paths: ['atlas-downloads/**', 'downloads/**', '_projects/**', 'draftpages/**', 'scripts/make_maps.py']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: atlas-data
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: python3 scripts/make_maps.py
      - run: |
          git add -A _maps atlas-data
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atlas data rebuilt after upload'
          git pull --rebase origin master && git push origin HEAD:master
