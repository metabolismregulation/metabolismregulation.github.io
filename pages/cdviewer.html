---
layout: default
title: CellDesigner Viewer
permalink: /cdviewer/
sitemap: false
noindex: true
---

<style>
  /* the Atlas's layout, lean: the official maps on the left, the CellDesigner file of the
     chosen one in the middle, as MINERVA draws it (scripts/make_cdviewer.py) or as CellDesigner
     draws it (scripts/cdrender.py; the switch right of Update), and an empty
     column of the list's width on the right, so the middle stays centred under the header */
  .m2 { display: grid; grid-template-columns: 240px minmax(600px, 1fr) minmax(0, 240px); column-gap: 32px; align-items: start;
        width: min(100vw / var(--zoom, 1) - 32px, 2000px); position: relative; left: 50%; transform: translateX(-50%); }
  .m2-nav { grid-column: 1; }
  .m2-main { grid-column: 2; min-width: 0; }
  #m2-list { max-height: calc(100vh / var(--zoom, 1) - 140px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  @media (max-width: 940px) {
    .m2 { display: block; width: auto; left: 0; transform: none; }
    .m2-nav { margin-bottom: 12px; }
    #m2-list { max-height: 127px; border-bottom: 1px solid #eee; }
  }
  .m2-group { font-size: 14px; line-height: 18px; color: #000; padding: 2px 5px 2px 0; margin-top: 6px; }
  .m2-group:first-child { margin-top: 0; }
  /* flex: none: the list has a max-height, and an item with overflow hidden would otherwise
     shrink to fit it, its highlight cutting the text */
  .m2-group, .m2-item { flex: none; }
  .m2-item { display: block; width: calc(100% - 14px); margin-left: 14px; text-align: left; font-size: 14px; line-height: 18px; padding: 2px 4px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m2-item:hover { background: #f3f3f3; }
  .m2-item.m2-on { background: #4183c4; color: #fff; }
  .m2-item:focus { outline: none; }
  .m2-item.m2-bad:not(.m2-on) { color: #c62828; }

  #m2-view { position: relative; width: 100%; height: 504px; min-height: 300px; max-height: calc(100vh / var(--zoom, 1) - 70px); resize: vertical; overflow: hidden; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: grab; touch-action: none; user-select: none; }
  #m2-view.m2-drag { cursor: grabbing; }
  #m2-view:focus, .m2-ctrl button:focus { outline: none; }
  #m2-img { position: absolute; left: 0; top: 0; max-width: none; pointer-events: none; }
  #m2-err { position: absolute; left: 16px; top: 40px; right: 16px; font-size: 14px; color: #c62828; }
  .m2-ctrl { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; align-items: center; }
  .m2-ctrl button { font-size: 13px; min-width: 28px; padding: 2px 8px; color: #222; background: #fffffff0; border: 1px solid #bbb; border-radius: 4px; cursor: pointer; }
  .m2-ctrl button:hover { border-color: #4183c4; color: #4183c4; }
  #m2-out, #m2-in { box-sizing: border-box; width: 21px; height: 21px; min-width: 0; padding: 0; }
  #m2-fit { box-sizing: border-box; height: 21px; padding: 0 6px; }
  /* the switch between the two drawings, right of Update, in the look of its button, the chosen one blue */
  .m2-top { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; white-space: nowrap; }
  .m2-mode { display: flex; flex: none; }
  .m2-mode button { box-sizing: border-box; height: 30px; font: inherit; font-size: 14px; padding: 0 8px; color: #777; background: #fff; border: 1px solid #777; cursor: pointer; }
  .m2-mode button:first-child { border-radius: 5px 0 0 5px; border-right: 0; }
  .m2-mode button:last-child { border-radius: 0 5px 5px 0; }
  .m2-mode button:hover { color: #4183c4; }
  .m2-mode button.m2-on { background: #4183c4; border-color: #4183c4; color: #fff; }
  .m2-mode button:focus { outline: none; }
  #m2-err.m2-quiet { color: #777; }
  #m2-note { position: absolute; left: 8px; bottom: 8px; font-size: 12px; color: #777; background: #ffffffe0; padding: 0 4px; pointer-events: none; }
  #m2-note:empty { display: none; }
  #m2-zoom { font-size: 12px; color: #666; min-width: 40px; text-align: right; margin-right: 4px; }
  /* full screen: the map alone, as on the Atlas; the arrow keys still go through the list */
  #m2-view:fullscreen { width: 100vw; height: 100vh !important; max-height: none; border: 0; border-radius: 0; resize: none; }
  #m2-view:-webkit-full-screen { width: 100vw; height: 100vh !important; max-height: none; border: 0; border-radius: 0; resize: none; }
  #m2-full { box-sizing: border-box; width: 21px; height: 21px; min-width: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  #m2-full svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* the buttons of the Atlas download row: white, grey edge and text, filled blue on hover */
  .m2-btn { display: inline-flex; align-items: center; font: inherit; font-size: 14px; line-height: 20px; padding: 4px 10px; margin: 4px 4px 0 0; color: #777 !important; background: #fff; border: 1px solid #777; border-radius: 5px; text-decoration: none; cursor: pointer; }
  .m2-btn:hover { background: #4183c4; border-color: #4183c4; color: #fff !important; }
  .m2-btn:focus { outline: none; }
  .m2-btn svg { width: 14px; height: 14px; margin-left: 5px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #m2-downloads { margin: 10px 0 0; display: flex; flex-wrap: wrap; }
  /* Update: the browser's reload sign before the word, turning while the files are checked */
  /* Update: the reload sign alone in a square button (user, 2026-10-22) */
  #m2-update { box-sizing: border-box; width: 30px; height: 30px; margin: 0; padding: 0; justify-content: center; flex: none; }
  #m2-update svg { width: 16px; height: 16px; margin: 0; }
  #m2-update.m2-busy svg { animation: m2-turn 1s linear infinite; }
  @keyframes m2-turn { to { transform: rotate(360deg); } }
  #m2-status { font-size: 13px; color: #777; margin: 0 0 12px; min-height: 18px; }
  #m2-status.m2-bad { color: #c62828; }
  .m2 a { color: #1c47a9; }
  .m2 a:hover, .m2 a:active { color: #1c47a9; }
</style>

<div class="m2">
<div class="m2-nav">
<div class="m2-top">
<button type="button" class="m2-btn" id="m2-update" aria-label="Update" title="Update: check the official maps' CellDesigner files and draw the changed or new ones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
<div class="m2-mode" role="group" aria-label="Drawing">
<button type="button" data-mode="minerva" title="As MINERVA draws the CellDesigner file">MINERVA</button>
<button type="button" data-mode="cd" title="As CellDesigner draws the file">CellDesigner</button>
</div>
</div>
<div id="m2-status"></div>
<div id="m2-list"></div>
</div>
<div class="m2-main">
<div id="m2-view" tabindex="0">
<img id="m2-img" alt="">
<div id="m2-err"></div>
<div id="m2-note"></div>
<div class="m2-ctrl">
<span id="m2-zoom"></span>
<button type="button" id="m2-out" title="Zoom out">&minus;</button>
<button type="button" id="m2-in" title="Zoom in">+</button>
<button type="button" id="m2-fit">Fit</button>
<button type="button" id="m2-full" title="Full screen" aria-label="Full screen"></button>
</div>
</div>
<div id="m2-downloads"></div>
</div>
</div>

<script>
(function () {
  // A lean copy of the Atlas viewer (as the Colours page's): the map fits the window when
  // chosen, never above the reading size (100%, 0.675 px per unit, as the map pages), the
  // wheel or a pinch zooms at the pointer, a drag moves it, Fit returns. The up and down
  // arrow keys go through the list. The switch right of Update shows MINERVA's drawing or
  // the drawing in CellDesigner's style (?view=celldesigner, remembered in this browser).
  var view = document.getElementById('m2-view'), img = document.getElementById('m2-img');
  var err = document.getElementById('m2-err'), list = document.getElementById('m2-list');
  var STANDARD = 0.675, MIN = 0.08, MAX = 4, KEEP = 80;
  var z = STANDARD, tx = 0, ty = 0, moved = false, mapW = 0, mapH = 0, shown = false;
  var maps = [], cur = -1, buttons = [];
  function pz() { return view.currentCSSZoom || 1; }
  function draw() {
    if (!shown) return;
    var w = mapW * z, h = mapH * z, vw = view.clientWidth, vh = view.clientHeight;
    tx = Math.min(vw - Math.min(KEEP, w), Math.max(Math.min(KEEP, w) - w, tx));
    ty = Math.min(vh - Math.min(KEEP, h), Math.max(Math.min(KEEP, h) - h, ty));
    img.style.width = w + 'px';
    img.style.height = h + 'px';
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    document.getElementById('m2-zoom').textContent = Math.round(z / STANDARD * 100) + '%';
  }
  function zoomAt(nz, cx, cy) {
    nz = Math.max(MIN, Math.min(MAX, nz));
    tx = cx - (cx - tx) * nz / z;
    ty = cy - (cy - ty) * nz / z;
    z = nz;
    moved = true;
    draw();
  }
  function fit() {
    if (!shown) return;
    z = Math.min(view.clientWidth / mapW, view.clientHeight / mapH, STANDARD);
    tx = (view.clientWidth - mapW * z) / 2;
    ty = (view.clientHeight - mapH * z) / 2;
    moved = false;
    draw();
  }
  function centre() { return [view.clientWidth / 2, view.clientHeight / 2]; }
  document.getElementById('m2-in').addEventListener('click', function () { var c = centre(); zoomAt(z * 1.25, c[0], c[1]); });
  document.getElementById('m2-out').addEventListener('click', function () { var c = centre(); zoomAt(z / 1.25, c[0], c[1]); });
  document.getElementById('m2-fit').addEventListener('click', fit);
  view.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = view.getBoundingClientRect();
    zoomAt(z * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), (e.clientX - r.left) / pz(), (e.clientY - r.top) / pz());
  }, { passive: false });
  view.addEventListener('dblclick', function (e) {
    if (e.target.closest('.m2-ctrl')) return;
    var r = view.getBoundingClientRect();
    zoomAt(z * 1.5, (e.clientX - r.left) / pz(), (e.clientY - r.top) / pz());
  });
  var pts = {}, last = null;
  view.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.m2-ctrl')) return;
    var r = view.getBoundingClientRect();
    if (e.clientX > r.right - 18 && e.clientY > r.bottom - 18) return; // the resize handle
    view.setPointerCapture(e.pointerId);
    pts[e.pointerId] = [e.clientX, e.clientY];
    last = null;
    view.classList.add('m2-drag');
  });
  view.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    var prev = pts[e.pointerId];
    pts[e.pointerId] = [e.clientX, e.clientY];
    var ids = Object.keys(pts);
    if (ids.length === 1) {
      tx += (e.clientX - prev[0]) / pz();
      ty += (e.clientY - prev[1]) / pz();
      moved = true;
      draw();
    } else if (ids.length === 2) {
      var a = pts[ids[0]], b = pts[ids[1]], r = view.getBoundingClientRect();
      var d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (last) zoomAt(z * d / last, ((a[0] + b[0]) / 2 - r.left) / pz(), ((a[1] + b[1]) / 2 - r.top) / pz());
      last = d;
    }
  });
  function release(e) {
    delete pts[e.pointerId];
    last = null;
    if (!Object.keys(pts).length) view.classList.remove('m2-drag');
  }
  view.addEventListener('pointerup', release);
  view.addEventListener('pointercancel', release);
  // the window's height: 77% of the browser window, as the Atlas's, until its lower edge is dragged
  var autoH = null;
  function viewHeight() {
    if (autoH !== null && view.style.height !== autoH) return;
    autoH = Math.round(Math.max(300, window.innerHeight / pz() * 0.77)) + 'px';
    view.style.height = autoH;
  }
  viewHeight();
  window.addEventListener('resize', viewHeight);
  if (window.ResizeObserver) new ResizeObserver(function () { if (moved) draw(); else fit(); }).observe(view);
  // full screen: the map alone; Esc or the button returns to the page
  var full = document.getElementById('m2-full');
  var FULL_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  var EXIT_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  function isFull() { return (document.fullscreenElement || document.webkitFullscreenElement) === view; }
  function showFull() {
    var on = isFull();
    full.innerHTML = on ? EXIT_ICON : FULL_ICON;
    full.title = on ? 'Exit full screen (Esc)' : 'Full screen';
    full.setAttribute('aria-label', full.title);
  }
  if (view.requestFullscreen || view.webkitRequestFullscreen) {
    showFull();
    full.addEventListener('click', function () {
      if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (view.requestFullscreen || view.webkitRequestFullscreen).call(view);
    });
    var onFull = function () { showFull(); requestAnimationFrame(function () { if (moved) draw(); else fit(); }); };
    document.addEventListener('fullscreenchange', onFull);
    document.addEventListener('webkitfullscreenchange', onFull);
  } else full.style.display = 'none'; // iPhone: no full screen for page elements

  // a map drawn by Update is shown from the browser's memory, the others from cdviewer/
  function svgOf(m) { return m.src || '{{ site.baseurl }}/cdviewer/' + m.base + '.svg?' + m.sha1.slice(0, 8); }
  function cdOf(m) { return '{{ site.baseurl }}/cdviewer/drawn/' + m.base + '.svg?' + m.drawn.svg.slice(0, 8); }
  var note = document.getElementById('m2-note'), modes = document.querySelectorAll('.m2-mode button');
  var mode = new URLSearchParams(location.search).get('view') === 'celldesigner' ? 'cd' : null;
  if (!mode) try { mode = localStorage.getItem('cdviewer-mode'); } catch (e) {}
  if (mode !== 'cd') mode = 'minerva';
  function address() {
    if (cur >= 0) history.replaceState(null, '', '?map=' + maps[cur].base.replace(/^F\d+-/, '') + (mode === 'cd' ? '&view=celldesigner' : ''));
  }
  // the chosen map in the chosen drawing; a map with no CellDesigner export says so
  function show() {
    var m = maps[cur], cd = mode === 'cd';
    Array.prototype.forEach.call(modes, function (b) { b.classList.toggle('m2-on', b.getAttribute('data-mode') === mode); });
    note.textContent = '';
    err.className = '';
    var why = cd ? (m.drawn ? '' : 'Drawn after the next update of the site.') : m.error;
    if (why) {
      shown = false;
      img.removeAttribute('src');
      img.style.display = 'none';
      err.textContent = why;
      if (cd) err.className = 'm2-quiet';
      document.getElementById('m2-zoom').textContent = '';
      return;
    }
    if (cd && m.drawnSha && m.drawnSha !== m.sha1) note.textContent = 'Drawn from the file before its last change.';
    err.textContent = '';
    img.style.display = '';
    mapW = cd ? m.drawn.width : m.width;
    mapH = cd ? m.drawn.height : m.height;
    shown = true;
    img.src = cd ? cdOf(m) : svgOf(m);
    fit();
    // the neighbours load in the background, so the arrow keys show them at once
    [cur - 1, cur + 1].forEach(function (j) {
      var n = maps[j];
      if (!n) return;
      if (cd && n.drawn) new Image().src = cdOf(n);
      else if (!cd && !n.error) new Image().src = svgOf(n);
    });
  }
  Array.prototype.forEach.call(modes, function (b) {
    b.addEventListener('click', function () {
      if (mode === b.getAttribute('data-mode')) return;
      mode = b.getAttribute('data-mode');
      try { localStorage.setItem('cdviewer-mode', mode); } catch (e) {}
      address();
      if (cur >= 0) show();
    });
  });
  var DL_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 15v5h16v-5"/></svg>';
  // a new tab: the arrow that goes up and then right (↱), the Converter's navigation arrow (↳) turned upwards (user, 2026-10-22)
  var EXT_ICON = '<svg viewBox="0 0 24 24" class="m2-ext" aria-hidden="true"><path d="M6 20v-8a3 3 0 0 1 3-3h11M15 4l5 5-5 5"/></svg>';
  function choose(i, again) {
    if (i < 0 || i >= maps.length || (i === cur && !again)) return;
    if (cur >= 0 && buttons[cur]) buttons[cur].classList.remove('m2-on');
    cur = i;
    var m = maps[i], b = buttons[i];
    b.classList.add('m2-on');
    b.scrollIntoView({ block: 'nearest' });
    address();
    document.getElementById('m2-downloads').innerHTML =
      '<a class="m2-btn" href="{{ site.baseurl }}' + m.file + '" download title="' + m.base + '.xml">CellDesigner' + DL_ICON + '</a>' +
      '<a class="m2-btn" href="{{ site.baseurl }}' + m.page + '" target="_blank" rel="noopener">Map page' + EXT_ICON + '</a>';
    show();
  }
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowDown') choose(cur + 1);
    else if (e.key === 'ArrowUp') choose(cur - 1);
    else if (document.activeElement === view && (e.key === '+' || e.key === '=')) { var c = centre(); zoomAt(z * 1.25, c[0], c[1]); }
    else if (document.activeElement === view && e.key === '-') { var c2 = centre(); zoomAt(z / 1.25, c2[0], c2[1]); }
    else if (document.activeElement === view && e.key === '0') fit();
    else return;
    e.preventDefault();
  });

  function buildList() {
    list.innerHTML = '';
    buttons = [];
    var group = null;
    maps.forEach(function (m, i) {
      if (m.group !== group) {
        group = m.group;
        var g = document.createElement('div');
        g.className = 'm2-group';
        g.textContent = group;
        list.appendChild(g);
      }
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'm2-item' + (m.error ? ' m2-bad' : '');
      b.textContent = m.name;
      b.title = m.error ? m.name + ': ' + m.error : m.name;
      b.addEventListener('click', function () { choose(i); });
      buttons.push(b);
      list.appendChild(b);
    });
  }

  // Update: the official maps as the Maps page lists them now, each CellDesigner file their pages
  // link (read from the pages, as the Maps page shows only their top) compared (sha1) with the one
  // drawn, and the changed or new ones drawn by MINERVA's conversion service, in this browser. The drawings stay until the page is reloaded; the Atlas
  // data workflow stores them in cdviewer/ after a push.
  var MINERVA = 'https://minerva-service.lcsb.uni.lu/minerva/api/convert/image/CellDesigner_SBML:svg';
  var upd = document.getElementById('m2-update'), status = document.getElementById('m2-status');
  function say(t, bad) { status.textContent = t; status.classList.toggle('m2-bad', !!bad); }
  function sha1(buf) {
    return crypto.subtle.digest('SHA-1', buf).then(function (h) {
      return Array.prototype.map.call(new Uint8Array(h), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function drawFile(m, buf, sha) {
    return fetch(MINERVA, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: buf }).then(function (r) { return r.text(); }).then(function (t) {
      if (t.indexOf('<svg') < 0) {
        var why = t;
        try { var j = JSON.parse(t); why = j.reason || j.error; } catch (e) {}
        m.error = 'MINERVA: ' + why;
        return;
      }
      // Java's Dialog font, which browsers lack: Arial's metrics, as in scripts/make_cdviewer.py
      t = t.split('font-family="\'Dialog\'"').join('font-family="\'Dialog\', \'Liberation Sans\', Arial, sans-serif"');
      var vb = /viewBox="[\d.\-]+ [\d.\-]+ ([\d.]+) ([\d.]+)"/.exec(t);
      m.width = +vb[1];
      m.height = +vb[2];
      if (m.drawn && !m.drawnSha) m.drawnSha = m.sha1;  // the CellDesigner-style drawing is of this file
      if (m.src) URL.revokeObjectURL(m.src);
      m.src = URL.createObjectURL(new Blob([t], { type: 'image/svg+xml' }));
      m.error = '';
      m.sha1 = sha;
    }, function () { m.error = 'MINERVA could not be reached'; });
  }
  upd.addEventListener('click', function () {
    if (upd.classList.contains('m2-busy')) return;
    upd.classList.add('m2-busy');
    say('Reading the Maps page');
    var shown = cur >= 0 ? maps[cur].base : null;
    function page(url) {
      return fetch(url, { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (html) { return new DOMParser().parseFromString(html, 'text/html'); });
    }
    page('{{ site.baseurl }}/maps/').then(function (doc) {
      var pages = Array.prototype.map.call(doc.querySelectorAll('article h1 a'), function (a) { return [a.getAttribute('href'), a.textContent.trim()]; });
      return Promise.all(pages.map(function (pg) { return page(pg[0]).then(function (d) { return [pg, d]; }); }));
    }).then(function (docs) {
      var found = [];
      docs.forEach(function (pd) {
        pd[1].querySelectorAll('a[href*="/downloads/"]').forEach(function (a) {
          var f = /\/downloads\/([^\/]+)\.xml$/.exec(a.getAttribute('href'));
          if (f && !/-SBML$/.test(f[1]) && !found.some(function (x) { return x.base === f[1]; }))
            found.push({ base: f[1], page: pd[0][0], title: pd[0][1] });
        });
      });
      say('Checking ' + found.length + ' CellDesigner files');
      return Promise.all(found.map(function (f) {
        return fetch('{{ site.baseurl }}/downloads/' + f.base + '.xml', { cache: 'no-cache' }).then(function (r) { return r.arrayBuffer(); })
          .then(function (buf) { return sha1(buf).then(function (h) { f.buf = buf; f.sha1 = h; return f; }); });
      }));
    }).then(function (found) {
      var old = {}, changed = [];
      maps.forEach(function (m) { old[m.base] = m; });
      var next = found.map(function (f) {
        var m = old[f.base];
        if (!m) {
          var t = f.title.replace(/^Regulation of (the )?/, '');
          m = { base: f.base, name: /^[a-z][a-z]/.test(t) ? t.charAt(0).toUpperCase() + t.slice(1) : t, group: 'New on the Maps page', file: '/downloads/' + f.base + '.xml', sha1: '' };
        }
        m.page = f.page;
        if (m.sha1 !== f.sha1) changed.push([m, f.buf, f.sha1]);
        return m;
      });
      // the Atlas's order for the maps the viewer knew, new ones at the end
      next.sort(function (a, b) { return (a.group === 'New on the Maps page') - (b.group === 'New on the Maps page') || maps.indexOf(a) - maps.indexOf(b); });
      say(changed.length ? 'Drawing ' + changed.length + ' with MINERVA' : '');
      return changed.reduce(function (p, c) { return p.then(function () { return drawFile(c[0], c[1], c[2]); }); }, Promise.resolve()).then(function () {
        var gone = maps.filter(function (m) { return next.indexOf(m) < 0; }).length;
        maps = next;
        buildList();
        var i = maps.findIndex(function (m) { return m.base === shown; });
        cur = -1;
        choose(i < 0 ? 0 : i, true);
        var bad = changed.filter(function (c) { return c[0].error; }).length;
        var parts = [];
        if (changed.length > bad) parts.push((changed.length - bad) + ' drawn again: ' + changed.filter(function (c) { return !c[0].error; }).map(function (c) { return c[0].name; }).join(', '));
        if (bad) parts.push(bad + ' not drawn (red in the list)');
        if (gone) parts.push(gone + ' no longer on the Maps page');
        say(parts.length ? parts.join('. ') + '.' : 'All ' + maps.length + ' up to date.', bad);
      });
    }).catch(function (e) { say('Update failed: ' + e.message, true); }).then(function () { upd.classList.remove('m2-busy'); });
  });

  fetch('{{ site.baseurl }}/cdviewer/maps.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (data) {
    maps = data;
    buildList();
    var want = new URLSearchParams(location.search).get('map');
    var start = maps.findIndex(function (m) { return m.base.replace(/^F\d+-/, '') === want; });
    choose(start < 0 ? 0 : start);
  });
})();
</script>
