---
layout: default
title: Atlas
permalink: /atlas/
sitemap: false
---

<style>
  /* the map column keeps the width of the other pages (the site's 840 px
     column); the list sits to its left on wide screens and above it on
     narrow ones, so the margin on the right stays free for scrolling */
  .m2 { position: relative; }
  .m2-nav { margin-bottom: 16px; }
  @media (min-width: 1400px) {
    .m2-nav { position: absolute; top: 0; right: calc(100% + 32px); width: 240px; margin: 0; }
    #m2-list { max-height: calc(100vh - 200px); overflow-y: auto; }
  }
  @media (max-width: 1399px) {
    #m2-list { max-height: 200px; overflow-y: auto; border-bottom: 1px solid #eee; }
  }

  #m2-search { width: 100%; box-sizing: border-box; font-size: 13px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 16px; }
  #m2-list { display: flex; flex-direction: column; gap: 2px; }
  .m2-item { display: block; width: 100%; text-align: left; font-size: 13px; padding: 2px 4px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; color: #000; }
  .m2-item:hover { border-color: #bbb; }
  .m2-item.m2-on { border-color: #333; font-weight: bold; }
  .m2-item:focus { outline: none; }
  .m2-none { font-size: 12px; color: #666; padding: 2px 4px; }

  .m2-main h2 { font-size: 20px; margin: 0 0 8px; }
  /* the view can be made larger with its lower right corner */
  #m2-view { position: relative; width: 100%; height: 560px; min-width: 300px; min-height: 240px; max-width: 96vw; resize: both; overflow: hidden; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: grab; touch-action: none; user-select: none; }
  #m2-view.m2-drag { cursor: grabbing; }
  #m2-img { position: absolute; left: 0; top: 0; max-width: none; pointer-events: none; }
  .m2-ctrl { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; align-items: center; }
  .m2-ctrl button { font-size: 13px; min-width: 28px; padding: 2px 8px; color: #222; background: #fffffff0; border: 1px solid #bbb; border-radius: 4px; cursor: pointer; }
  .m2-ctrl button:hover { border-color: #888; }
  #m2-out, #m2-in { box-sizing: border-box; width: 21px; height: 21px; min-width: 0; padding: 0; } /* square */
  /* one button for both modes: it shows the current one */
  #m2-mode { box-sizing: border-box; width: 44px; height: 21px; padding: 0; border-color: #333; background: #eee; }
  #m2-zoom { font-size: 12px; color: #666; min-width: 40px; text-align: right; margin-right: 4px; }

  #m2-downloads { margin: 10px 0 0; }
  #m2-downloads a { display: inline-block; font-size: 13px; padding: 4px 10px; margin: 4px 4px 0 0; color: #222; background: #f4f4f4; border: 1px solid #bbb; border-radius: 5px; text-decoration: none; }
  #m2-downloads a:hover { background: #ebebeb; border-color: #999; }
  #m2-text { margin-top: 16px; }
  #m2-text h2 { font-size: 18px; }
</style>

<div class="m2">
<div class="m2-nav">
<input type="search" id="m2-search" placeholder="Search maps" autocomplete="off">
<div id="m2-list"></div>
</div>
<div class="m2-main">
<h2 id="m2-title"></h2>
<div id="m2-view" tabindex="0">
<img id="m2-img" alt="">
<div class="m2-ctrl">
<span id="m2-zoom"></span>
<button type="button" id="m2-out" title="Zoom out">&minus;</button>
<button type="button" id="m2-in" title="Zoom in">+</button>
<button type="button" id="m2-mode"></button>
</div>
</div>
<div id="m2-downloads"></div>
<div id="m2-text"></div>
</div>
</div>

<script>
(function () {
  // Zoom is measured in screen pixels per yEd unit, so every map shows its
  // boxes and labels at the same size whatever the resolution of its image
  // (scale = image pixels per yEd unit, from scripts/make_maps.py).
  var STANDARD = 0.675, MIN = 0.08, MAX = 4, KEEP = 80; // KEEP: pixels of map kept in view
  // how a map opens: 'read' at the standard zoom, or 'fit'. Set by the mode
  // button and remembered by the browser where it can
  var mode = 'read';
  try { if (localStorage.getItem('atlas-view') === 'fit') mode = 'fit'; } catch (e) {}
  var maps = [], byId = {}, topics = [], current = null, textCache = {};
  var view = document.getElementById('m2-view'), img = document.getElementById('m2-img');
  var z = STANDARD, tx = 0, ty = 0;
  var moved = false; // zoomed or panned away from the mode's view

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function scaleOf(m) { return m.scale || 1.5; }
  function size(m) { return { w: m.width / scaleOf(m), h: m.height / scaleOf(m) }; } // in yEd units

  // ---------- viewer ----------
  function clamp() {
    var s = size(current), w = s.w * z, h = s.h * z, vw = view.clientWidth, vh = view.clientHeight;
    tx = Math.min(vw - Math.min(KEEP, w), Math.max(Math.min(KEEP, w) - w, tx));
    ty = Math.min(vh - Math.min(KEEP, h), Math.max(Math.min(KEEP, h) - h, ty));
  }
  function draw() {
    if (!current) return;
    clamp();
    // sized by width and height, not a scale transform, so that an SVG map
    // is drawn sharp at every zoom
    var s = size(current);
    img.style.width = s.w * z + 'px';
    img.style.height = s.h * z + 'px';
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    document.getElementById('m2-zoom').textContent = Math.round(z / STANDARD * 100) + '%';
  }
  function zoomAt(nz, cx, cy) {
    nz = Math.max(MIN, Math.min(MAX, nz));
    tx = cx - (cx - tx) * nz / z;
    ty = cy - (cy - ty) * nz / z;
    z = nz;
    moved = true;
    draw();
  }
  function fitZoom() {
    var s = size(current);
    return Math.min(view.clientWidth / s.w, view.clientHeight / s.h) * 0.96;
  }
  // standard zoom; a map smaller than the view is centred, a larger one
  // starts at its top, centred left to right
  function standard() {
    var s = size(current);
    z = STANDARD;
    tx = (view.clientWidth - s.w * z) / 2;
    ty = Math.max(0, (view.clientHeight - s.h * z) / 2);
    moved = false;
    draw();
  }
  function fit() {
    var s = size(current);
    z = fitZoom();
    tx = (view.clientWidth - s.w * z) / 2;
    ty = (view.clientHeight - s.h * z) / 2;
    moved = false;
    draw();
  }
  var centre = function () { return [view.clientWidth / 2, view.clientHeight / 2]; };
  document.getElementById('m2-in').addEventListener('click', function () { var c = centre(); zoomAt(z * 1.25, c[0], c[1]); });
  document.getElementById('m2-out').addEventListener('click', function () { var c = centre(); zoomAt(z / 1.25, c[0], c[1]); });
  function setMode(m) {
    mode = m;
    try { localStorage.setItem('atlas-view', m); } catch (e) {}
    showMode();
    if (m === 'fit') fit(); else standard();
  }
  function showMode() {
    var b = document.getElementById('m2-mode');
    b.textContent = mode === 'fit' ? 'Fit' : 'Read';
    b.title = mode === 'fit'
      ? 'Whole map. Click for reading size, the same for every map'
      : 'Reading size, the same for every map. Click for the whole map';
  }
  showMode();
  // after zooming or panning, a click returns to the mode's view;
  // from that view, a click switches mode
  function modeButton() {
    if (moved) { if (mode === 'fit') fit(); else standard(); }
    else setMode(mode === 'fit' ? 'read' : 'fit');
  }
  document.getElementById('m2-mode').addEventListener('click', modeButton);
  view.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = view.getBoundingClientRect();
    zoomAt(z * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  view.addEventListener('dblclick', function (e) {
    if (e.target.closest('.m2-ctrl')) return;
    var r = view.getBoundingClientRect();
    zoomAt(z * 1.5, e.clientX - r.left, e.clientY - r.top);
  });
  // drag with one pointer, pinch with two
  var pts = {}, last = null;
  view.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.m2-ctrl')) return;
    // leave the lower right corner to the browser's resize handle
    var r = view.getBoundingClientRect();
    if (e.clientX > r.right - 18 && e.clientY > r.bottom - 18) return;
    view.setPointerCapture(e.pointerId);
    pts[e.pointerId] = [e.clientX, e.clientY];
    last = null;
    view.classList.add('m2-drag');
  });
  view.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    var prev = pts[e.pointerId];
    pts[e.pointerId] = [e.clientX, e.clientY];
    var ids = Object.keys(pts);
    if (ids.length === 1) {
      tx += e.clientX - prev[0];
      ty += e.clientY - prev[1];
      moved = true;
      draw();
    } else if (ids.length === 2) {
      var a = pts[ids[0]], b = pts[ids[1]], r = view.getBoundingClientRect();
      var d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (last) zoomAt(z * d / last, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
      last = d;
    }
  });
  function release(e) {
    delete pts[e.pointerId];
    last = null;
    if (!Object.keys(pts).length) view.classList.remove('m2-drag');
  }
  view.addEventListener('pointerup', release);
  view.addEventListener('pointercancel', release);
  view.addEventListener('keydown', function (e) {
    var c = centre();
    if (e.key === '+' || e.key === '=') zoomAt(z * 1.25, c[0], c[1]);
    else if (e.key === '-') zoomAt(z / 1.25, c[0], c[1]);
    else if (e.key === '0') modeButton();
    else return;
    e.preventDefault();
  });
  window.addEventListener('resize', draw);
  if (window.ResizeObserver) new ResizeObserver(draw).observe(view);

  // ---------- navigation ----------
  // one row per map: the topic, with the variant in brackets when a topic
  // has several maps, as in Glycogen metabolism (muscle)
  function label(m) { return m.topic + (m.tab ? ' (' + m.tab + ')' : ''); }
  function buildList(filter) {
    var box = document.getElementById('m2-list');
    var keep = box.scrollTop;
    box.innerHTML = '';
    var q = (filter || '').trim().toLowerCase();
    var shown = maps.filter(function (m) {
      return !q || (label(m) + ' ' + m.title).toLowerCase().indexOf(q) >= 0;
    });
    shown.forEach(function (m) {
      var b = el('button', 'm2-item' + (m === current ? ' m2-on' : ''), label(m));
      b.type = 'button';
      b.setAttribute('data-id', m.id);
      b.addEventListener('click', function () { go(m.id); });
      box.appendChild(b);
    });
    if (!shown.length) box.appendChild(el('div', 'm2-none', 'No map matches'));
    // keep the chosen map visible when the list scrolls (narrow screens)
    box.scrollTop = keep;
    var on = box.querySelector('.m2-on');
    if (on && box.scrollHeight > box.clientHeight) box.scrollTop = Math.max(0, Math.min(box.scrollTop, on.offsetTop - box.offsetTop), on.offsetTop - box.offsetTop + on.offsetHeight - box.clientHeight);
  }
  document.getElementById('m2-search').addEventListener('input', function () { buildList(this.value); });
  // arrow keys step through the listed maps, as on the Colours page; wraps around.
  // In the search box only up and down, so left and right still move the cursor
  document.addEventListener('keydown', function (e) {
    var dir = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (!dir) return;
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var t = e.target.closest ? e.target.closest('input, select, textarea, [contenteditable]') : null;
    if (t && !(t.id === 'm2-search' && (e.key === 'ArrowDown' || e.key === 'ArrowUp'))) return;
    var items = Array.prototype.slice.call(document.querySelectorAll('#m2-list .m2-item'));
    if (!items.length) return;
    e.preventDefault();
    var i = items.findIndex(function (b) { return b.classList.contains('m2-on'); });
    var n = items.length;
    var next = i < 0 ? (dir > 0 ? 0 : n - 1) : (i + dir + n) % n;
    var id = items[next].getAttribute('data-id');
    // replace, so stepping through the list does not fill the browser history
    if (id !== location.hash.slice(1)) location.replace('#' + id);
  });

  // ---------- one map ----------
  function show(m) {
    current = m;
    document.getElementById('m2-title').textContent = m.title;
    document.title = m.title + ' – Atlas';
    var topic = topics.filter(function (t) { return t.name === m.topic; })[0];
    img.removeAttribute('src');
    img.alt = m.title;
    img.src = m.image;
    img.width = m.width;
    img.height = m.height;
    if (mode === 'fit') fit(); else standard();
    var dl = document.getElementById('m2-downloads');
    dl.innerHTML = '';
    (m.downloads || []).forEach(function (d) {
      var a = el('a', null, d.label);
      a.href = d.url;
      if (/^https?:/.test(d.url)) { a.target = '_blank'; a.rel = 'noopener'; } else a.setAttribute('download', '');
      dl.appendChild(a);
    });
    // the text: this map's own, or the first map of its topic that has one
    var source = m.hasText ? m : topic.maps.filter(function (o) { return o.hasText; })[0];
    var box = document.getElementById('m2-text');
    box.innerHTML = '';
    if (!source) return;
    var put = function (html) { if (current === m) box.innerHTML = html; };
    if (textCache[source.id]) return put(textCache[source.id]);
    fetch(source.data).then(function (r) { return r.json(); }).then(function (d) {
      textCache[source.id] = d.html;
      put(d.html);
    });
  }
  function go(id) {
    if (location.hash.slice(1) !== id) location.hash = id;
    else route();
  }
  function route() {
    var m = byId[location.hash.slice(1)] || maps[0];
    if (!m) return;
    show(m);
    buildList(document.getElementById('m2-search').value);
  }
  window.addEventListener('hashchange', route);

  fetch('{{ "/atlas/index.json" | relative_url }}').then(function (r) { return r.json(); }).then(function (list) {
    maps = list;
    maps.forEach(function (m) {
      byId[m.id] = m;
      var t = topics.filter(function (x) { return x.name === m.topic; })[0];
      if (!t) topics.push(t = { name: m.topic, maps: [] });
      t.maps.push(m);
    });
    route();
  });
})();
</script>
