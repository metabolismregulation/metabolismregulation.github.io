    <meta charset="utf-8" />
    <meta content='text/html; charset=utf-8' http-equiv='Content-Type'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    {% if page.draft or page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0'>

    {% if page.excerpt %}
    <meta name="description" content="{{ page.excerpt| strip_html }}" />
    <meta property="og:description" content="{{ page.excerpt| strip_html }}" />
    {% else %}
    <meta name="description" content="{{ site.description }}">
    <meta property="og:description" content="{{ site.description }}" />
    {% endif %}
    <meta name="author" content="{{ site.name }}" />

    {% if page.title %}
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="twitter:title" content="{{ page.title }}" />
    {% endif %}
    {% if page.icon %}
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/images/{{ page.icon }}/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/{{ page.icon }}/favicon-32.png">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/images/{{ page.icon }}/apple-touch-icon.png">
    {% endif %}
