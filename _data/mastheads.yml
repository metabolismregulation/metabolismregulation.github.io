# Sub-sites under this roof with their own name and top bar (front matter masthead: <key>). Every other page keeps
# the site's name and navigation. A menu entry with items is a drop-down (opened by a click, so it works on phones). Patterns (user, 2026-10-30). The Eicosanoid Atlas had one here
# until it moved to its own site (2026-11-01). A menu entry with under: true is also marked on the pages below its url.
patterns:
  name: "Regulation Patterns"
  description: "Recurring patterns in cell signalling and metabolic regulation"
  home: "/pattern-list/"
  nav:
    - {label: "Pattern Atlas", url: "/pattern-atlas/"}
    - {label: "Pattern List", url: "/pattern-list/"}
converter:  # the Converter's pages and its documentation (user, 2026-11-02), in place of the row of links at their top:
  # their own menu only, the site's name, subtitle and logo kept for now (user, 2026-11-02, no name here); the page
  # shown not in bold, as the Eicosanoid Atlas (plain: true)
  plain: true
  nav:
    - {label: "Converter", url: "/converter/"}
    - {label: "Description", url: "/converter/description/"}
    - {label: "Architecture", url: "/converter/architecture/"}
    - {label: "Documentation", url: "/converter/docs/", under: true}
