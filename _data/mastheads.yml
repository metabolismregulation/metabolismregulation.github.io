# Sub-sites under this roof with their own name and top bar (front matter masthead: <key>). Every other page keeps
# the site's name and navigation. A menu entry with items is a drop-down (opened by a click, so it works on phones). Patterns (user, 2026-10-30), the Eicosanoid Atlas (user, 2026-11-01).
patterns:
  name: "Regulation Patterns"
  description: "Recurring patterns in cell signalling and metabolic regulation"
  home: "/pattern-list/"
  nav:
    - {label: "Pattern Atlas", url: "/pattern-atlas/"}
    - {label: "Pattern List", url: "/pattern-list/"}
eicosanoids:
  name: "Eicosanoids"
  avatar: "/images/eicosanoids-logo.svg"
  description: "Production, receptors, regulation"
  home: "/eicosanoid-atlas/"
  nav:
    - {label: "Atlas", url: "/eicosanoid-atlas/"}
    - label: "By enzyme"
      items:
        - {label: "Overview", url: "/eicosanoid-atlas/structure/"}
        - {label: "Layers", url: "/eicosanoid-atlas/layers/"}
        - {label: "List", url: "/eicosanoid-atlas/list/"}
    - label: "By branch"
      items:
        - {label: "Overview", url: "/eicosanoid-atlas/branches/"}
        - {label: "Layers", url: "/eicosanoid-atlas/branch-layers/"}
        - {label: "List", url: "/eicosanoid-atlas/branch-list/"}
