# The menu of the layout documentation on the website (/human-like-layout/documentation/), copied there by
# tools/to_website.sh as _data/layout_docs.yml. Sections as in the converter's documentation (Diátaxis:
# tutorial, how-to guides, reference, explanation), then the development record. A page is its file
# name in docs/, lower case; an entry with url links a page outside docs/.
- section: Start
  pages:
    - {page: index, title: Overview}
    - {page: start, title: Lay out a first map}
- section: How-to guides
  pages:
    - {page: howto, title: All guides}
- section: Reference
  pages:
    - {page: rules, title: Drawing rules}
    - {page: checks, title: Checks}
    - {page: scripts, title: Scripts}
- section: Explanation
  pages:
    - {url: /human-like-layout/architecture/, title: Architecture}
    - {page: principles, title: Principles}
    - {page: large-maps, title: Large maps}
- section: Development
  pages:
    - {page: issues, title: Issues}
    - {page: planned, title: Planned}
    - {page: changes, title: Changes}
    - {url: /human-like-layout/architecture1/, title: First architecture}
