# Contributors and their affiliations, shown on the map pages.
#
# Each person's affiliations are kept here as in the manuscript author list
# (keys from the list below), so they can be checked against it in one place.
#
# A map page names its contributors by key in the front matter and shows them
# under "## Contributors" with {% include contributors.html %}:
#   contributors:
#     - alexander-mazein
#     - vasundra-toure
# Each person gets the affiliations listed here. Where a map should show
# others (for example where the work was done), give that person's keys on the
# page; they replace the ones here for that page only:
#   contributors:
#     - alexander-mazein: [lcsb]
#     - vasundra-toure
# The affiliations are numbered per page in the order the people are listed.
#
# Key: first and family name, lowercase, hyphens, no accents or middle
# initials. A key never changes once it is used on a page; to change how a
# name is shown, edit `name`.
#
# Affiliations and spelling of names follow the manuscript (author list of
# MetabolismRegulation_MAIN, 2026-10-15). For the website, institutions end
# with town and country, without street addresses or postcodes (user,
# 2026-10-16). ORCID iDs checked against their
# orcid.org records (2026-10-15).

